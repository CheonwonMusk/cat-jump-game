<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>냥이의 파스텔 2단 점프</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #FAF5FF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 스마트폰 비율 컨테이너 (9:16) */
    #game-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      max-height: 720px;
      aspect-ratio: 9 / 16;
      box-shadow: 0 15px 35px rgba(180, 160, 200, 0.3);
      border-radius: 28px;
      overflow: hidden;
      background: #FDE2E4;
      border: 4px solid #FFFFFF;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 상단 UI 오버레이 */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .ui-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-badge {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      color: #6C5B7B;
      font-size: 1.15rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-chip {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.82rem;
      color: #7B6888;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
    }

    .btn-sound {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s;
    }
    .btn-sound:active {
      transform: scale(0.9);
    }

    /* 테마 변경 알림 토스트 배너 */
    #themeToast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 24px;
      font-weight: 800;
      font-size: 0.92rem;
      color: #5A4065;
      box-shadow: 0 8px 20px rgba(108, 91, 123, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 20;
    }
    #themeToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 게임오버 및 시작 화면 오버레이 */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(108, 91, 123, 0.35);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 30;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 28px 24px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(108, 91, 123, 0.2);
      width: 85%;
      max-width: 310px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .card h1 {
      font-size: 1.55rem;
      color: #59405C;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.95rem;
      color: #8C7A96;
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .stats {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      color: #6C5B7B;
      font-weight: 600;
    }

    .stat-row span.val {
      color: #FF758F;
      font-weight: 800;
    }

    .btn-action {
      background: linear-gradient(135deg, #FFB4A2 0%, #E5989B 100%);
      color: white;
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(229, 152, 155, 0.4);
      width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-action:active {
      transform: scale(0.96);
      box-shadow: 0 3px 8px rgba(229, 152, 155, 0.3);
    }

    .guide-chip {
      margin-top: 14px;
      font-size: 0.82rem;
      color: #927E9C;
      line-height: 1.4;
    }
    .badge-double {
      display: inline-block;
      background: #FFE5EC;
      color: #FF5D8F;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <!-- 상단 점수 & 테마 & 음소거 -->
    <div class="ui-layer">
      <div class="ui-left">
        <div class="score-badge">
          <span>🐾</span>
          <span id="scoreText">0</span>
        </div>
        <div id="themeChip" class="theme-chip">🌸 봄빛 피치</div>
      </div>
      <button id="soundToggle" class="btn-sound" title="소리 켜기/끄기">🔔</button>
    </div>

    <!-- 10점마다 바뀌는 테마 알림 배너 -->
    <div id="themeToast">✨ 10점 달성! 테마 변경!</div>

    <!-- 시작 / 게임오버 모달 -->
    <div id="gameModal" class="modal-overlay active">
      <div class="card">
        <h1 id="modalTitle">🐾 냥이의 점프</h1>
        <p id="modalDesc">
          <span class="badge-double">✨ 2단 점프 가능!</span><br>
          스페이스바 또는 화면 터치로<br>공중에서 한 번 더 점프해보세요!
        </p>
        
        <div id="modalStats" class="stats" style="display: none;">
          <div class="stat-row">
            <span>이번 점수</span>
            <span class="val" id="finalScore">0</span>
          </div>
          <div class="stat-row">
            <span>최고 점수</span>
            <span class="val" id="bestScore">0</span>
          </div>
        </div>

        <button id="btnPlay" class="btn-action">게임 시작!</button>
        <div class="guide-chip">10점마다 파스텔 배경이 부드럽게 변해요 🎨</div>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       웹 오디오 API (효과음)
       ============================================================ */
    class SoundController {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playJump(isDouble = false) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = isDouble ? 'triangle' : 'sine';
        const startFreq = isDouble ? 480 : 320;
        const endFreq = isDouble ? 960 : 660;

        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.16);
        gain.gain.setValueAtTime(isDouble ? 0.22 : 0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.16);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }
      playScore() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playThemeChange() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // 도 미 솔 높은도
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          gain.gain.setValueAtTime(0.12, now + idx * 0.07);
          gain.gain.linearRampToValueAtTime(0, now + idx * 0.07 + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.07);
          osc.stop(now + idx * 0.07 + 0.15);
        });
      }
      playHit() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      toggle() {
        this.muted = !this.muted;
        return !this.muted;
      }
    }

    const sound = new SoundController();

    /* ============================================================
       파스텔 테마 색상 팔레트 (10점마다 순환 변경)
       ============================================================ */
    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function lerpColor(c1, c2, t) {
      return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
    }
    function rgbToStr([r, g, b]) {
      return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
    }

    const THEMES = [
      {
        name: '🌸 봄빛 피치',
        skyTop: hexToRgb('#FFE5EC'),
        skyMid: hexToRgb('#F0E6FF'),
        skyBottom: hexToRgb('#E8F0FE'),
        hill: [216, 226, 220],
        groundTop: hexToRgb('#CBE8BA'),
        groundMid: hexToRgb('#DDE5B6'),
        groundBottom: hexToRgb('#B7B7A4')
      },
      {
        name: '🌿 민트 브리즈',
        skyTop: hexToRgb('#D8F3DC'),
        skyMid: hexToRgb('#B7E4C7'),
        skyBottom: hexToRgb('#E0FAFF'),
        hill: [183, 228, 199],
        groundTop: hexToRgb('#95D5B2'),
        groundMid: hexToRgb('#74C69D'),
        groundBottom: hexToRgb('#52B788')
      },
      {
        name: '🔮 몽환 라벤더',
        skyTop: hexToRgb('#E2D4F0'),
        skyMid: hexToRgb('#D3BCE8'),
        skyBottom: hexToRgb('#FCE1E4'),
        hill: [218, 198, 237],
        groundTop: hexToRgb('#BCA0DC'),
        groundMid: hexToRgb('#A685D2'),
        groundBottom: hexToRgb('#8B6AB9')
      },
      {
        name: '🌅 노을빛 캔디',
        skyTop: hexToRgb('#FFD6A5'),
        skyMid: hexToRgb('#FFCAD4'),
        skyBottom: hexToRgb('#FCEADE'),
        hill: [255, 183, 178],
        groundTop: hexToRgb('#E29578'),
        groundMid: hexToRgb('#DDA15E'),
        groundBottom: hexToRgb('#BC6C25')
      },
      {
        name: '🌌 별빛 트와일라잇',
        skyTop: hexToRgb('#B8C0FF'),
        skyMid: hexToRgb('#C8B6FF'),
        skyBottom: hexToRgb('#E7C6FF'),
        hill: [187, 175, 232],
        groundTop: hexToRgb('#9A8C98'),
        groundMid: hexToRgb('#6B5F70'),
        groundBottom: hexToRgb('#4A4E69')
      },
      {
        name: '🍬 달콤 솜사탕',
        skyTop: hexToRgb('#BEE1E6'),
        skyMid: hexToRgb('#DFE7FD'),
        skyBottom: hexToRgb('#FFD6E0'),
        hill: [205, 180, 219],
        groundTop: hexToRgb('#FFC8DD'),
        groundMid: hexToRgb('#FFAFCC'),
        groundBottom: hexToRgb('#E5989B')
      }
    ];

    // 현재 부드럽게 보간되는 테마 상태
    const currentThemeColors = {
      skyTop: [...THEMES[0].skyTop],
      skyMid: [...THEMES[0].skyMid],
      skyBottom: [...THEMES[0].skyBottom],
      hill: [...THEMES[0].hill],
      groundTop: [...THEMES[0].groundTop],
      groundMid: [...THEMES[0].groundMid],
      groundBottom: [...THEMES[0].groundBottom]
    };

    let currentThemeIndex = 0;

    /* ============================================================
       게임 기본 설정 및 변수
       ============================================================ */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('game-wrapper');

    const scoreText = document.getElementById('scoreText');
    const themeChip = document.getElementById('themeChip');
    const themeToast = document.getElementById('themeToast');
    const soundToggle = document.getElementById('soundToggle');
    const gameModal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalStats = document.getElementById('modalStats');
    const finalScore = document.getElementById('finalScore');
    const bestScoreEl = document.getElementById('bestScore');
    const btnPlay = document.getElementById('btnPlay');

    const VIRTUAL_WIDTH = 360;
    const VIRTUAL_HEIGHT = 640;
    const GROUND_Y = 510;

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = parseInt(localStorage.getItem('cat_jump_highscore') || '0', 10);
    let gameSpeed = 3.6;
    let frames = 0;
    let obstacles = [];
    let particles = [];
    let clouds = [];

    // 사운드 버튼 토글
    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      sound.init();
      const on = sound.toggle();
      soundToggle.textContent = on ? '🔔' : '🔕';
    });

    /* ============================================================
       구름 초기화
       ============================================================ */
    function initClouds() {
      clouds = [
        { x: 30, y: 70, speed: 0.35, scale: 0.9 },
        { x: 210, y: 130, speed: 0.25, scale: 1.2 },
        { x: 110, y: 220, speed: 0.45, scale: 0.75 },
      ];
    }

    /* ============================================================
       플레이어 (귀여운 고양이 + 2단 점프 & 공중제비)
       ============================================================ */
    const cat = {
      x: 65,
      y: GROUND_Y - 42,
      w: 44,
      h: 40,
      vy: 0,
      gravity: 0.65,
      jumpPower: -11.8,
      grounded: true,
      jumpCount: 0,        // 현재 점프 횟수 (최대 2단)
      maxJumps: 2,
      spinAngle: 0,        // 2단 점프 시 귀여운 공중제비 각도
      tailAngle: 0,
      blinkTimer: 0,
      runCycle: 0,

      reset() {
        this.y = GROUND_Y - this.h;
        this.vy = 0;
        this.grounded = true;
        this.jumpCount = 0;
        this.spinAngle = 0;
        this.runCycle = 0;
      },

      jump() {
        if (this.jumpCount < this.maxJumps) {
          const isDouble = this.jumpCount === 1;
          this.vy = isDouble ? this.jumpPower * 0.93 : this.jumpPower;
          this.jumpCount++;
          this.grounded = false;

          sound.init();
          sound.playJump(isDouble);

          if (isDouble) {
            // 2단 점프: 공중제비 회전 및 무지개 별사탕 파티클 팡팡!
            this.spinAngle = Math.PI * 2;
            createDoubleJumpSparkles(this.x + this.w / 2, this.y + this.h / 2);
          } else {
            createJumpHearts(this.x + this.w / 2, this.y + this.h);
          }
        }
      },

      update() {
        this.vy += this.gravity;
        this.y += this.vy;

        // 공중제비 감속
        if (this.spinAngle > 0) {
          this.spinAngle = Math.max(0, this.spinAngle - 0.32);
        }

        if (this.y >= GROUND_Y - this.h) {
          this.y = GROUND_Y - this.h;
          this.vy = 0;
          if (!this.grounded) {
            createLandingDust(this.x + this.w / 2, GROUND_Y);
          }
          this.grounded = true;
          this.jumpCount = 0;
          this.spinAngle = 0;
        }

        this.runCycle += 0.2;
        this.tailAngle = Math.sin(this.runCycle * 1.5) * 0.35;
        this.blinkTimer = (this.blinkTimer + 1) % 180;
      },

      draw() {
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);

        // 2단 점프 시 공중제비 360도 회전, 일반 점프 시 기울기
        if (this.spinAngle > 0) {
          ctx.rotate(Math.PI * 2 - this.spinAngle);
        } else if (!this.grounded) {
          ctx.rotate(this.vy * 0.025);
        }

        // --- 꼬리 ---
        ctx.save();
        ctx.translate(-16, 2);
        ctx.rotate(-0.4 + this.tailAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-15, -12, -10, -22);
        ctx.strokeStyle = '#F7B267';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();

        // --- 다리 (뛰는 애니메이션) ---
        const legOffset1 = this.grounded ? Math.sin(this.runCycle * 2) * 5 : 3;
        const legOffset2 = this.grounded ? -Math.sin(this.runCycle * 2) * 5 : -2;

        ctx.fillStyle = '#E8984E';
        // 뒷다리
        ctx.beginPath();
        ctx.arc(-8 + legOffset2, 16, 4.5, 0, Math.PI * 2);
        ctx.arc(10 - legOffset2, 16, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // 앞다리
        ctx.fillStyle = '#FFF1E6';
        ctx.beginPath();
        ctx.arc(-10 + legOffset1, 17, 5, 0, Math.PI * 2);
        ctx.arc(8 - legOffset1, 17, 5, 0, Math.PI * 2);
        ctx.fill();

        // --- 몸통 (치즈 태비 냥이) ---
        ctx.fillStyle = '#F7C59F';
        ctx.beginPath();
        ctx.ellipse(0, 4, 18, 15, 0, 0, Math.PI * 2);
        ctx.fill();

        // 배 하얀 털
        ctx.fillStyle = '#FFF5EB';
        ctx.beginPath();
        ctx.ellipse(3, 7, 10, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- 귀 ---
        // 왼쪽 귀
        ctx.fillStyle = '#F7B267';
        ctx.beginPath();
        ctx.moveTo(-14, -8);
        ctx.lineTo(-7, -22);
        ctx.lineTo(0, -9);
        ctx.closePath();
        ctx.fill();

        // 왼쪽 속귀
        ctx.fillStyle = '#FFCAD4';
        ctx.beginPath();
        ctx.moveTo(-12, -9);
        ctx.lineTo(-7, -19);
        ctx.lineTo(-2, -9);
        ctx.closePath();
        ctx.fill();

        // 오른쪽 귀
        ctx.fillStyle = '#F7B267';
        ctx.beginPath();
        ctx.moveTo(3, -9);
        ctx.lineTo(11, -22);
        ctx.lineTo(17, -7);
        ctx.closePath();
        ctx.fill();

        // 오른쪽 속귀
        ctx.fillStyle = '#FFCAD4';
        ctx.beginPath();
        ctx.moveTo(5, -9);
        ctx.lineTo(11, -19);
        ctx.lineTo(15, -8);
        ctx.closePath();
        ctx.fill();

        // --- 머리 ---
        ctx.fillStyle = '#F7C59F';
        ctx.beginPath();
        ctx.ellipse(3, -5, 16, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // 이마 치즈 무늬
        ctx.fillStyle = '#E8984E';
        ctx.beginPath();
        ctx.moveTo(1, -18);
        ctx.lineTo(3, -12);
        ctx.lineTo(5, -18);
        ctx.closePath();
        ctx.fill();

        // --- 볼터치 ---
        ctx.fillStyle = 'rgba(255, 140, 160, 0.45)';
        ctx.beginPath();
        ctx.arc(-5, 0, 4.5, 0, Math.PI * 2);
        ctx.arc(12, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // --- 눈 (깜빡임 or 점프 표정) ---
        ctx.fillStyle = '#4A3B32';
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#4A3B32';

        if (!this.grounded) {
          // 점프 중 신난 (> <) 표정
          ctx.beginPath();
          ctx.moveTo(-6, -4);
          ctx.lineTo(-3, -2);
          ctx.lineTo(-6, 0);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(8, -4);
          ctx.lineTo(11, -2);
          ctx.lineTo(8, 0);
          ctx.stroke();
        } else if (this.blinkTimer > 170) {
          // 깜빡이기
          ctx.beginPath();
          ctx.moveTo(-7, -2);
          ctx.lineTo(-3, -2);
          ctx.moveTo(7, -2);
          ctx.lineTo(11, -2);
          ctx.stroke();
        } else {
          // 똘망똘망한 눈
          ctx.beginPath();
          ctx.arc(-5, -2, 2.5, 0, Math.PI * 2);
          ctx.arc(9, -2, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(-6, -3, 1, 0, Math.PI * 2);
          ctx.arc(8, -3, 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // --- 코 & 입 ---
        ctx.fillStyle = '#FF99A8';
        ctx.beginPath();
        ctx.moveTo(1, -1);
        ctx.lineTo(3, 1);
        ctx.lineTo(5, -1);
        ctx.closePath();
        ctx.fill();

        // 앙증맞은 입 ( :3 )
        ctx.strokeStyle = '#6D4C41';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(1.5, 2.5, 2, 0, Math.PI);
        ctx.arc(4.5, 2.5, 2, 0, Math.PI);
        ctx.stroke();

        // --- 수염 ---
        ctx.strokeStyle = 'rgba(74, 59, 50, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-11, -1);
        ctx.lineTo(-17, -3);
        ctx.moveTo(-11, 2);
        ctx.lineTo(-17, 4);
        ctx.moveTo(14, -1);
        ctx.lineTo(20, -3);
        ctx.moveTo(14, 2);
        ctx.lineTo(20, 4);
        ctx.stroke();

        ctx.restore();
      }
    };

    /* ============================================================
       장애물 (털실, 화분 선인장, 마카롱)
       ============================================================ */
    class Obstacle {
      constructor(type) {
        this.type = type;
        this.passed = false;
        this.x = VIRTUAL_WIDTH + 20;

        if (this.type === 0) {
          this.w = 34;
          this.h = 34;
          this.y = GROUND_Y - this.h;
          this.color = ['#FFB5A7', '#B8E0D2', '#D8B4E2', '#A2D2FF', '#FDE4CF'][Math.floor(Math.random() * 5)];
          this.rot = 0;
        } else if (this.type === 1) {
          this.w = 30;
          this.h = 44;
          this.y = GROUND_Y - this.h;
        } else {
          this.w = 32;
          this.h = 40;
          this.y = GROUND_Y - this.h;
        }
      }

      update() {
        this.x -= gameSpeed;
        if (this.type === 0) {
          this.rot -= 0.08;
        }
      }

      draw() {
        ctx.save();
        if (this.type === 0) {
          // 털실 뭉치
          ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
          ctx.rotate(this.rot);

          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(0, 0, this.w / 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, this.w / 2 - 4, -0.6, 1.2);
          ctx.moveTo(-10, -5);
          ctx.lineTo(8, 7);
          ctx.stroke();

          ctx.strokeStyle = this.color;
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(8, 12);
          ctx.quadraticCurveTo(18, 18, 26, 14);
          ctx.stroke();

        } else if (this.type === 1) {
          // 미니 선인장 화분
          ctx.fillStyle = '#E0A899';
          ctx.beginPath();
          ctx.moveTo(this.x + 4, this.y + this.h);
          ctx.lineTo(this.x + this.w - 4, this.y + this.h);
          ctx.lineTo(this.x + this.w - 2, this.y + this.h - 16);
          ctx.lineTo(this.x + 2, this.y + this.h - 16);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#99D98C';
          ctx.beginPath();
          ctx.roundRect(this.x + 7, this.y + 4, this.w - 14, 25, [10, 10, 2, 2]);
          ctx.fill();

          ctx.fillStyle = '#FF8FA3';
          ctx.beginPath();
          ctx.arc(this.x + this.w / 2, this.y + 4, 4.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#4A3B32';
          ctx.beginPath();
          ctx.arc(this.x + 11, this.y + 15, 1.5, 0, Math.PI * 2);
          ctx.arc(this.x + 19, this.y + 15, 1.5, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // 2단 마카롱
          ctx.fillStyle = '#CDB4DB';
          ctx.beginPath();
          ctx.roundRect(this.x + 2, this.y + 22, this.w - 4, 16, 7);
          ctx.fill();
          ctx.fillStyle = '#FFF1E6';
          ctx.fillRect(this.x + 5, this.y + 28, this.w - 10, 4);

          ctx.fillStyle = '#FFC8DD';
          ctx.beginPath();
          ctx.roundRect(this.x + 4, this.y + 5, this.w - 8, 16, 7);
          ctx.fill();
          ctx.fillStyle = '#FFF1E6';
          ctx.fillRect(this.x + 7, this.y + 11, this.w - 14, 4);

          ctx.fillStyle = '#FF4D6D';
          ctx.beginPath();
          ctx.arc(this.x + this.w / 2, this.y + 4, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    /* ============================================================
       파티클 (점프 하트, 2단점프 별빛, 착지 먼지)
       ============================================================ */
    function createJumpHearts(x, y) {
      for (let i = 0; i < 4; i++) {
        particles.push({
          type: 'heart',
          x: x + (Math.random() - 0.5) * 20,
          y: y - 5,
          vx: (Math.random() - 0.5) * 2,
          vy: -(Math.random() * 2 + 1),
          alpha: 1,
          size: Math.random() * 5 + 6,
          color: ['#FFCAD4', '#B8E0D2', '#FFE5EC'][Math.floor(Math.random() * 3)]
        });
      }
    }

    // 2단 점프 전용 반짝이 별빛 파티클
    function createDoubleJumpSparkles(x, y) {
      const colors = ['#FFD166', '#06D6A0', '#118AB2', '#FF6B6B', '#C77DFF', '#FFF3B0'];
      for (let i = 0; i < 9; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3.5 + 1.5;
        particles.push({
          type: 'star',
          x: x,
          y: y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          alpha: 1,
          size: Math.random() * 4 + 4,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function createLandingDust(x, y) {
      for (let i = 0; i < 5; i++) {
        particles.push({
          type: 'dust',
          x: x + (Math.random() - 0.5) * 24,
          y: y - 2,
          vx: (Math.random() - 0.5) * 2.5,
          vy: -Math.random() * 1.5,
          alpha: 0.8,
          size: Math.random() * 3 + 2,
          color: '#E8DED1'
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.024;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;

        if (p.type === 'heart') {
          ctx.translate(p.x, p.y);
          ctx.beginPath();
          const s = p.size / 10;
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-5 * s, -7 * s, -12 * s, 0, 0, 10 * s);
          ctx.bezierCurveTo(12 * s, 0, 5 * s, -7 * s, 0, 0);
          ctx.fill();
        } else if (p.type === 'star') {
          // 반짝이는 별사탕 모양
          ctx.translate(p.x, p.y);
          ctx.beginPath();
          const r = p.size;
          for (let s = 0; s < 5; s++) {
            ctx.lineTo(Math.cos((18 + s * 72) * Math.PI / 180) * r, -Math.sin((18 + s * 72) * Math.PI / 180) * r);
            ctx.lineTo(Math.cos((54 + s * 72) * Math.PI / 180) * (r * 0.45), -Math.sin((54 + s * 72) * Math.PI / 180) * (r * 0.45));
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    /* ============================================================
       구름 및 배경 렌더링 (부드러운 테마 색상 전환)
       ============================================================ */
    function drawCloud(c) {
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale);
      ctx.beginPath();
      ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.arc(16, -6, 22, 0, Math.PI * 2);
      ctx.arc(36, 0, 18, 0, Math.PI * 2);
      ctx.arc(20, 10, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function updateAndDrawBackground() {
      // 목표 테마로 서서히 부드럽게 색상 보간 (Lerp factor = 0.04)
      const target = THEMES[currentThemeIndex];
      const factor = 0.04;
      currentThemeColors.skyTop = lerpColor(currentThemeColors.skyTop, target.skyTop, factor);
      currentThemeColors.skyMid = lerpColor(currentThemeColors.skyMid, target.skyMid, factor);
      currentThemeColors.skyBottom = lerpColor(currentThemeColors.skyBottom, target.skyBottom, factor);
      currentThemeColors.hill = lerpColor(currentThemeColors.hill, target.hill, factor);
      currentThemeColors.groundTop = lerpColor(currentThemeColors.groundTop, target.groundTop, factor);
      currentThemeColors.groundMid = lerpColor(currentThemeColors.groundMid, target.groundMid, factor);
      currentThemeColors.groundBottom = lerpColor(currentThemeColors.groundBottom, target.groundBottom, factor);

      // 1. 하늘 그라데이션
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, rgbToStr(currentThemeColors.skyTop));
      skyGrad.addColorStop(0.5, rgbToStr(currentThemeColors.skyMid));
      skyGrad.addColorStop(1, rgbToStr(currentThemeColors.skyBottom));
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, VIRTUAL_WIDTH, GROUND_Y);

      // 2. 구름
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -80) c.x = VIRTUAL_WIDTH + 40;
        drawCloud(c);
      });

      // 3. 언덕
      ctx.fillStyle = `rgba(${Math.round(currentThemeColors.hill[0])}, ${Math.round(currentThemeColors.hill[1])}, ${Math.round(currentThemeColors.hill[2])}, 0.55)`;
      ctx.beginPath();
      ctx.moveTo(-20, GROUND_Y);
      ctx.quadraticCurveTo(80, GROUND_Y - 45, 180, GROUND_Y);
      ctx.quadraticCurveTo(270, GROUND_Y - 55, 380, GROUND_Y);
      ctx.fill();

      // 4. 바닥 (상단 잔디층 + 밑면 그라데이션)
      ctx.fillStyle = rgbToStr(currentThemeColors.groundTop);
      ctx.fillRect(0, GROUND_Y, VIRTUAL_WIDTH, 14);

      // 잔디 꽃망울 장식
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      for (let i = 0; i < VIRTUAL_WIDTH; i += 45) {
        const flowX = (i - (frames * 0.8) % 45 + 45) % VIRTUAL_WIDTH;
        ctx.beginPath();
        ctx.arc(flowX, GROUND_Y + 7, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // 땅 밑면
      const groundGrad = ctx.createLinearGradient(0, GROUND_Y + 14, 0, VIRTUAL_HEIGHT);
      groundGrad.addColorStop(0, rgbToStr(currentThemeColors.groundMid));
      groundGrad.addColorStop(1, rgbToStr(currentThemeColors.groundBottom));
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GROUND_Y + 14, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - (GROUND_Y + 14));
    }

    /* ============================================================
       충돌 검사
       ============================================================ */
    function checkCollision(c, o) {
      const catCenterX = c.x + c.w / 2;
      const catCenterY = c.y + c.h / 2;
      const catRadius = 13;

      const ox = o.x + 4;
      const oy = o.y + 4;
      const ow = o.w - 8;
      const oh = o.h - 6;

      const closestX = Math.max(ox, Math.min(catCenterX, ox + ow));
      const closestY = Math.max(oy, Math.min(catCenterY, oy + oh));

      const dx = catCenterX - closestX;
      const dy = catCenterY - closestY;

      return (dx * dx + dy * dy) < (catRadius * catRadius);
    }

    /* ============================================================
       게임 루프 및 로직 제어
       ============================================================ */
    function showToast(text) {
      themeToast.textContent = text;
      themeToast.classList.add('show');
      setTimeout(() => {
        themeToast.classList.remove('show');
      }, 1800);
    }

    function checkThemeUpdate() {
      // 10점마다 테마 변경
      const newThemeIndex = Math.floor(score / 10) % THEMES.length;
      if (newThemeIndex !== currentThemeIndex) {
        currentThemeIndex = newThemeIndex;
        const newTheme = THEMES[currentThemeIndex];
        themeChip.textContent = newTheme.name;
        showToast(`✨ ${score}점 달성! [${newTheme.name}]`);
        sound.playThemeChange();
      }
    }

    function resetGame() {
      score = 0;
      currentThemeIndex = 0;
      themeChip.textContent = THEMES[0].name;
      gameSpeed = 3.6;
      frames = 0;
      obstacles = [];
      particles = [];
      scoreText.textContent = '0';
      cat.reset();
      initClouds();
    }

    function startGame() {
      sound.init();
      resetGame();
      gameState = 'PLAYING';
      gameModal.classList.remove('active');
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      sound.playHit();

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cat_jump_highscore', highScore.toString());
      }

      modalTitle.textContent = '아쉽다냥! 😿';
      modalDesc.innerHTML = '<span class="badge-double">Tip</span> 공중에서 한번 더 점프해<br>연속 장애물을 피해 보세요!';
      modalStats.style.display = 'flex';
      finalScore.textContent = score;
      bestScoreEl.textContent = highScore;
      btnPlay.textContent = '다시 도전하기';

      setTimeout(() => {
        gameModal.classList.add('active');
      }, 350);
    }

    function triggerJump() {
      if (gameState === 'PLAYING') {
        cat.jump();
      } else if (gameState === 'START' || gameState === 'GAMEOVER') {
        startGame();
      }
    }

    function gameLoop() {
      frames++;

      ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

      // 부드러운 테마 배경
      updateAndDrawBackground();

      if (gameState === 'PLAYING') {
        cat.update();

        // 장애물 생성 (점수가 오르면 가끔 연속 2개나 템포 변경)
        if (frames % 95 === 0 || (frames > 120 && Math.random() < 0.016 && obstacles.length < 3)) {
          const lastObs = obstacles[obstacles.length - 1];
          if (!lastObs || (VIRTUAL_WIDTH - lastObs.x > 140)) {
            const randomType = Math.floor(Math.random() * 3);
            obstacles.push(new Obstacle(randomType));
          }
        }

        // 장애물 업데이트 및 충돌 검사
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();
          obs.draw();

          if (checkCollision(cat, obs)) {
            gameOver();
            break;
          }

          if (!obs.passed && obs.x + obs.w < cat.x) {
            obs.passed = true;
            score++;
            scoreText.textContent = score;
            sound.playScore();

            // 10점마다 테마 체크
            checkThemeUpdate();

            // 점수에 따른 서서히 속도 증가
            gameSpeed = 3.6 + Math.min(score * 0.07, 4.0);
          }

          if (obs.x + obs.w < -30) {
            obstacles.splice(i, 1);
          }
        }
      } else {
        cat.tailAngle = Math.sin(frames * 0.08) * 0.3;
        cat.blinkTimer = (cat.blinkTimer + 1) % 180;
      }

      // 파티클 업데이트 & 그리기
      updateAndDrawParticles();

      // 냥이 그리기
      cat.draw();

      requestAnimationFrame(gameLoop);
    }

    /* ============================================================
       입력 이벤트 리스너
       ============================================================ */
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        triggerJump();
      }
    });

    wrapper.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#soundToggle') || e.target.closest('.card')) return;
      triggerJump();
    });

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    // 시작
    initClouds();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
